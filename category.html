<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collection — Arsorel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Nunito:wght@400;600;700;800&family=Parisienne&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<div id="site-header-slot"></div>

<main class="wrap">
  <div class="crumb"><a href="index.html">Home</a> › <span id="crumbCat">Collection</span></div>
  <section class="section" style="padding-top:14px">
    <h1 class="section-title" id="catName">Collection</h1>
    <p class="section-sub" id="catBlurb"></p>
    <div class="grid" id="prodGrid"></div>
  </section>
</main>

<div id="site-footer-slot"></div>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/app.js"></script>
<script>
  const catId = qs("cat");
  const cat = CAT.category(catId);

  if (!cat) {
    document.getElementById("prodGrid").outerHTML =
      `<div class="empty">That collection doesn't exist. <a href="index.html">Back home</a></div>`;
  } else {
    document.title = cat.name + " — Arsorel";
    document.getElementById("crumbCat").textContent = cat.name;
    document.getElementById("catName").textContent = cat.emoji + " " + cat.name;
    document.getElementById("catBlurb").textContent = cat.blurb;

    const products = CAT.byCategory(catId);
    document.getElementById("prodGrid").innerHTML = products.map((p) => `
      <div class="card">
        <a class="card-media" href="product.html?id=${p.id}">${thumbHTML(p)}</a>
        <div class="card-body">
          <h3><a href="product.html?id=${p.id}" style="color:inherit;text-decoration:none">${p.name}</a></h3>
          <p>${p.story.split(".")[0]}.</p>
          <div class="card-foot">
            ${priceLabel(p.price)}
            <button class="btn ghost" style="padding:8px 16px" onclick="Cart.add('${p.id}');toast('Added ${p.name.replace(/'/g,"\\'")} to cart 🧺')">Add</button>
          </div>
        </div>
      </div>
    `).join("");
  }
</script>
