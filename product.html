<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product — Arsorel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Nunito:wght@400;600;700;800&family=Parisienne&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<div id="site-header-slot"></div>

<main class="wrap" id="main">
  <div class="crumb" id="crumb"><a href="index.html">Home</a></div>
  <section class="section" style="padding-top:14px" id="productSlot"></section>

  <section class="section" id="similarSlot" style="display:none">
    <h2 class="section-title">You may also love</h2>
    <p class="section-sub">More little treasures from the same collection.</p>
    <div class="grid" id="similarGrid"></div>
  </section>

  <section class="section">
    <div class="about" style="text-align:center">
      <h2>Looking for something else?</h2>
      <p>Can't find the flower or piece you have in mind? We make custom orders too —
         tell us your idea and we'll craft it just for you.</p>
      <div class="row" style="justify-content:center">
        <a class="btn" href="category.html?cat=custom">Explore custom orders</a>
        <a class="btn ghost" id="askWa" target="_blank" rel="noopener">Ask on WhatsApp</a>
      </div>
    </div>
  </section>
</main>

<div id="site-footer-slot"></div>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/app.js"></script>
<script>
  const p = CAT.byId(qs("id"));

  if (!p) {
    document.getElementById("productSlot").innerHTML =
      `<div class="empty">This treasure couldn't be found. <a href="index.html">Back home</a></div>`;
  } else {
    const cat = CAT.category(p.category);
    document.title = p.name + " — Arsorel";
    document.getElementById("crumb").innerHTML =
      `<a href="index.html">Home</a> › <a href="category.html?cat=${cat.id}">${cat.name}</a> › ${p.name}`;

    document.getElementById("productSlot").innerHTML = `
      <div class="product">
        <div class="media">${thumbHTML(p)}</div>
        <div>
          <h1>${p.name}</h1>
          <div>${priceLabel(p.price).replace('class="price"','class="price big-price"')}</div>
          <blockquote class="story">“${p.story}”</blockquote>
          <div class="row">
            <div class="qty">
              <button onclick="stepQty(-1)">−</button>
              <input id="qty" value="1" inputmode="numeric" readonly>
              <button onclick="stepQty(1)">+</button>
            </div>
            <button class="btn" onclick="addToCart()">Add to cart</button>
          </div>
          <p class="note">${p.price == null
            ? "This piece is priced to your request — add it to your cart and we'll confirm the price with you on WhatsApp."
            : "Handmade to order. We'll confirm your order and delivery on WhatsApp after checkout."}</p>
        </div>
      </div>`;

    // Similar products (same category, excluding this one)
    const similar = CAT.byCategory(p.category).filter((x) => x.id !== p.id).slice(0, 4);
    if (similar.length) {
      document.getElementById("similarSlot").style.display = "";
      document.getElementById("similarGrid").innerHTML = similar.map((s) => `
        <div class="card">
          <a class="card-media" href="product.html?id=${s.id}">${thumbHTML(s)}</a>
          <div class="card-body">
            <h3><a href="product.html?id=${s.id}" style="color:inherit;text-decoration:none">${s.name}</a></h3>
            <div class="card-foot">
              ${priceLabel(s.price)}
              <a class="btn ghost" style="padding:8px 16px" href="product.html?id=${s.id}">View</a>
            </div>
          </div>
        </div>
      `).join("");
    }

    // WhatsApp "ask" link
    const waMsg = encodeURIComponent(`Hi Arsorel! I'm interested in the ${p.name}. Could you tell me more?`);
    document.getElementById("askWa").href = `https://wa.me/${CFG.whatsapp}?text=${waMsg}`;
  }

  function stepQty(d) {
    const el = document.getElementById("qty");
    el.value = Math.max(1, (parseInt(el.value, 10) || 1) + d);
  }
  function addToCart() {
    const q = Math.max(1, parseInt(document.getElementById("qty").value, 10) || 1);
    Cart.add(p.id, q);
    toast(`Added ${q} × ${p.name} to cart 🧺`);
  }
</script>
